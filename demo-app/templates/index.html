{% if error %}
    <div id="error-message">
        {{ error }}
    </div>
{% endif %}

<form method="POST" action="/member/search">

    <div>
        <label for="first_name">
            First Name
        </label>

        <input
            type="text"
            id="first_name"
            name="first_name"
        >
    </div>

    <div>
        <label for="last_name">
            Last Name
        </label>

        <input
            type="text"
            id="last_name"
            name="last_name"
        >
    </div>

    <div>
        <label for="member_id">
            Member Number
        </label>

        <input
            type="text"
            id="member_id"
            name="member_id"
        >
    </div>

    <div>
        <label for="account_number">
            Account Number
        </label>

        <input
            type="text"
            id="account_number"
            name="account_number"
        >
    </div>

    <div>
        <button type="submit">
            Search Member
        </button>

        <button type="reset">
            Clear Search
        </button>
    </div>

</form>
